name: Refresh trade review manifest

# A trade closing on the ledger updates trades.html instantly (the page reads the
# sheet live) but leaves trade_review_cards.json behind, so the just-closed trade
# renders the history-free fallback card until someone rebuilds by hand. This job
# does that rebuild unattended.
#
# It is safe to run at any time: with nothing newly closed the script rewrites
# nothing, the commit step is skipped, and the run is green. There is no degraded
# mode — if the export RPC cannot be read, or returns something that fails
# validation, the run fails and the manifest is left exactly as it was.

on:
  schedule:
    # Every 15 minutes; Actions scheduling and Pages propagation can add delay.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without committing'
        type: boolean
        default: false

# Never let two refreshes race for the same file; queue instead of cancelling so
# an in-flight commit is not interrupted half-written.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guard the builder before it is allowed to touch the shipped manifest.
      - name: Test builder and refresh logic
        run: |
          node --check build_review_manifest.js
          node --check refresh_review_manifest.js
          node tests/review-cards.test.js
          node tests/refresh-manifest.test.js
          node tests/history-completeness.test.js

      - name: Refresh manifest
        id: refresh
        env:
          # Read path is the token-gated RPC export_review_card_data: the apikey is
          # the project's public publishable key and the gate is the export token.
          # No service-role key is involved. A missing secret, a rejected token or
          # a payload that fails validation fails the step and commits nothing.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_CARD_EXPORT_KEY: ${{ secrets.SUPABASE_CARD_EXPORT_KEY }}
        run: |
          node refresh_review_manifest.js \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      # Re-run the card tests against the regenerated artifact: a bad card must
      # never reach main, even unattended.
      - name: Verify regenerated manifest
        if: steps.refresh.outputs.changed == 'true'
        run: node tests/review-cards.test.js

      - name: Commit and push
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade_review_cards.json
          git commit -m "chore(review-cards): refresh ${{ steps.refresh.outputs.upgraded }} trade histories"
          git push

      # GITHUB_TOKEN commits do not trigger the push-based Pages workflow.
      # Deploy in this run so a successful scheduled refresh reaches the site.
      - name: Setup Pages
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy refreshed cards
        if: steps.refresh.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
